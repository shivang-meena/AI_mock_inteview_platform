# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # This tells GitHub Actions to run all 'run' commands inside the server folder
    defaults:
      run:
        working-directory: server

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: server/package-lock.json
        
    - name: Install dependencies
      run: npm ci
      
    # postinstall script in package.json will automatically run prisma generate during npm ci
    # But we add it explicitly just to be 100% safe in CI environments
    - name: Generate Prisma Client
      run: npx prisma generate
      
    - name: Build TypeScript
      run: npm run build --if-present
      
    - name: Run Vitest unit tests
      run: npm test


