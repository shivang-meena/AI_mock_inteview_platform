<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chat App</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:ital,wght@1,400&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    scrollbar-width: thin;
    scrollbar-color: #262B36 transparent;
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #262B36; border-radius: 8px; }

  body {
    font-family: 'Inter', sans-serif;
    background: #0D0F14;
    color: #ECEAE3;
    height: 100vh;
    overflow: hidden;
  }

  .app {
    display: flex;
    height: 100vh;
    width: 100%;
  }

  /* Sidebar */
  .sidebar {
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
    transition: width 0.3s;
    background: #171A21;
    border-right: 1px solid #262B36;
    width: 272px;
  }
  .sidebar.closed {
    width: 0;
    border-right: none;
  }

  .sidebar-top {
    padding: 12px;
  }

  .new-chat-btn {
    background: transparent;
    border: 1px solid #262B36;
    color: #ECEAE3;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
  }
  .new-chat-btn:hover {
    background: #1D212A;
    border-color: #E8A33D88;
  }

  .conversations {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .conv-item {
    color: #8A90A0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 14px;
  }
  .conv-item:hover {
    background: #1D212A;
    color: #ECEAE3;
  }
  .conv-item.active {
    background: #1D212A;
    color: #ECEAE3;
  }
  .conv-item .title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .del-btn {
    opacity: 0;
    background: transparent;
    border: none;
    color: #5C6270;
    padding: 4px;
    border-radius: 6px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
  }
  .conv-item:hover .del-btn { opacity: 1; }
  .del-btn:hover {
    color: #E5484D;
    background: rgba(229, 72, 77, 0.1);
  }

  /* Main */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid #262B36;
  }

  .icon-btn {
    background: transparent;
    border: none;
    color: #8A90A0;
    padding: 6px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .icon-btn:hover {
    background: #1D212A;
    color: #ECEAE3;
  }

  .topbar-title {
    flex: 1;
    min-width: 0;
    font-size: 14px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .badge {
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 9999px;
    color: #E8A33D;
    background: rgba(232, 163, 61, 0.15);
    border: 1px solid rgba(232, 163, 61, 0.2);
  }

  /* Messages area */
  .messages-area {
    flex: 1;
    overflow-y: auto;
  }

  .empty-state {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    gap: 24px;
  }
  .empty-state h1 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 30px;
    font-weight: 400;
    margin-bottom: 8px;
  }
  .empty-state p {
    font-size: 14px;
    color: #8A90A0;
  }
  .suggestions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    max-width: 560px;
  }
  .chip {
    border: 1px solid #262B36;
    color: #8A90A0;
    background: transparent;
    cursor: pointer;
    transition: all 0.15s ease;
    font-size: 14px;
    padding: 8px 12px;
    border-radius: 9999px;
    font-family: inherit;
  }
  .chip:hover {
    border-color: #E8A33D;
    color: #ECEAE3;
    background: rgba(232, 163, 61, 0.15);
  }

  .messages-list {
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .msg-row {
    display: flex;
    flex-direction: column;
    animation: fadeUp 0.35s ease-out;
  }
  .msg-row.user { align-items: flex-end; }
  .msg-row.assistant { align-items: flex-start; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .user-bubble {
    background: #232833;
    border-radius: 16px;
    padding: 10px 16px;
    font-size: 14px;
    max-width: 70%;
    white-space: pre-wrap;
    line-height: 1.5;
  }

  .assistant-bubble {
    padding-left: 16px;
    font-size: 14px;
    border-left: 2px solid #E8A33D;
    max-width: 80%;
    white-space: pre-wrap;
    line-height: 1.6;
  }

  .msg-actions {
    opacity: 0;
    transition: opacity 0.15s ease;
    display: flex;
    gap: 4px;
    margin-top: 6px;
  }
  .msg-row.assistant .msg-actions { margin-left: 16px; }
  .msg-row:hover .msg-actions { opacity: 1; }

  .icon-btn-sm {
    background: transparent;
    border: none;
    color: #5C6270;
    padding: 4px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .icon-btn-sm:hover {
    color: #ECEAE3;
    background: #1D212A;
  }

  .thinking {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-left: 16px;
    border-left: 2px solid #262B36;
  }
  .think-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #E8A33D;
    animation: breathe 1.4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.35; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.2); }
  }
  .thinking-text {
    font-size: 12px;
    color: #8A90A0;
  }

  .error-box {
    font-size: 14px;
    padding: 8px 16px;
    border-radius: 12px;
    color: #E5484D;
    background: rgba(229, 72, 77, 0.1);
    border: 1px solid rgba(229, 72, 77, 0.3);
  }

  /* Input */
  .input-area {
    padding: 8px 16px 16px;
  }
  .input-wrapper {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    border-radius: 16px;
    padding: 8px 12px;
    background: #171A21;
    border: 1px solid #262B36;
  }
  .input-wrapper textarea {
    flex: 1;
    resize: none;
    background: transparent;
    outline: none;
    border: none;
    font-size: 14px;
    padding: 8px 0;
    color: #ECEAE3;
    font-family: 'Inter', sans-serif;
    max-height: 200px;
  }
  .input-wrapper textarea::placeholder {
    color: #5C6270;
  }

  .send-btn {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    width: 36px;
    height: 36px;
    border: none;
    cursor: default;
    background: #262B36;
    color: #5C6270;
  }
  .send-btn.active {
    background: #E8A33D;
    color: #0D0F14;
    cursor: pointer;
  }

  .disclaimer {
    text-align: center;
    font-size: 12px;
    margin-top: 8px;
    color: #5C6270;
  }

  /* Icons (inline SVG via pseudo-elements won't work well, so using inline SVG in HTML) */
  .icon { width: 16px; height: 16px; }
  .icon-sm { width: 13px; height: 13px; }
  .icon-md { width: 18px; height: 18px; }
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <button class="new-chat-btn" id="newChatBtn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New chat
      </button>
    </div>
    <div class="conversations" id="conversations"></div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <button class="icon-btn" id="toggleSidebar">
        <svg class="icon-md" id="sidebarIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
      </button>
      <div class="topbar-title" id="topbarTitle">New chat</div>
      <span class="badge">Claude Sonnet</span>
    </div>

    <div class="messages-area" id="messagesArea"></div>

    <div class="input-area">
      <div class="input-wrapper">
        <textarea id="input" placeholder="Message..." rows="1"></textarea>
        <button class="send-btn" id="sendBtn">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <div class="disclaimer">AI can make mistakes. Consider checking important information.</div>
    </div>
  </div>
</div>

<script>
// --- Config ---
const SUGGESTIONS = [
  'Explain quantum computing simply',
  'Draft a polite email declining a meeting',
  'Give me a 5-minute workout, no equipment',
  'Outline a short story about the sea',
];

const API_URL = 'https://api.anthropic.com/v1/messages';
const MODEL = 'claude-sonnet-4-6';

// --- State ---
function uid() {
  return Math.random().toString(36).slice(2, 10);
}

const initialId = uid();
let state = {
  conversations: {
    order: [initialId],
    byId: { [initialId]: { id: initialId, title: 'New chat', messages: [] } }
  },
  activeId: initialId,
  input: '',
  loading: false,
  sidebarOpen: true,
  copiedId: null,
  error: null,
};

// --- DOM refs ---
const sidebar = document.getElementById('sidebar');
const convList = document.getElementById('conversations');
const newChatBtn = document.getElementById('newChatBtn');
const toggleSidebarBtn = document.getElementById('toggleSidebar');
const topbarTitle = document.getElementById('topbarTitle');
const messagesArea = document.getElementById('messagesArea');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');

// --- Helpers ---
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function getActive() {
  return state.conversations.byId[state.activeId];
}

function updateConversation(id, updater) {
  state.conversations.byId[id] = updater(state.conversations.byId[id]);
}

function autoResizeTextarea() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + 'px';
}

// --- Rendering ---
function renderSidebar() {
  convList.innerHTML = '';
  state.conversations.order.forEach(id => {
    const c = state.conversations.byId[id];
    const item = document.createElement('div');
    item.className = 'conv-item' + (id === state.activeId ? ' active' : '');
    item.innerHTML = `
      <span class="title">${escapeHtml(c.title)}</span>
      <button class="del-btn" data-id="${id}" title="Delete">
        <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
      </button>
    `;
    item.addEventListener('click', () => {
      state.activeId = id;
      state.error = null;
      render();
    });
    item.querySelector('.del-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      deleteChat(id);
    });
    convList.appendChild(item);
  });
}

function renderMessages() {
  const active = getActive();
  topbarTitle.textContent = active.title;
  messagesArea.innerHTML = '';

  if (active.messages.length === 0) {
    messagesArea.innerHTML = `
      <div class="empty-state">
        <div>
          <h1>What's on your mind?</h1>
          <p>Ask anything — I'll do my best to help.</p>
        </div>
        <div class="suggestions">
          ${SUGGESTIONS.map(s => `<button class="chip" data-text="${escapeHtml(s)}">${escapeHtml(s)}</button>`).join('')}
        </div>
      </div>
    `;
    messagesArea.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => send(chip.dataset.text));
    });
  } else {
    const list = document.createElement('div');
    list.className = 'messages-list';

    active.messages.forEach((m, i) => {
      const row = document.createElement('div');
      row.className = 'msg-row ' + m.role;

      if (m.role === 'user') {
        row.innerHTML = `<div class="user-bubble">${escapeHtml(m.content)}</div>`;
      } else {
        row.innerHTML = `
          <div class="assistant-bubble">${escapeHtml(m.content)}</div>
          <div class="msg-actions">
            <button class="icon-btn-sm" data-action="copy" data-id="${m.id}" title="Copy">
              <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
            <button class="icon-btn-sm" data-action="regen" data-index="${i}" title="Regenerate">
              <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
            </button>
          </div>
        `;
      }
      list.appendChild(row);
    });

    if (state.loading) {
      const think = document.createElement('div');
      think.className = 'thinking';
      think.innerHTML = `<span class="think-dot"></span><span class="thinking-text">Thinking</span>`;
      list.appendChild(think);
    }

    if (state.error) {
      const err = document.createElement('div');
      err.className = 'error-box';
      err.textContent = state.error;
      list.appendChild(err);
    }

    messagesArea.appendChild(list);

    // Attach action listeners
    messagesArea.querySelectorAll('[data-action="copy"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const msg = active.messages.find(m => m.id === btn.dataset.id);
        if (msg) copyMsg(msg.id, msg.content, btn);
      });
    });
    messagesArea.querySelectorAll('[data-action="regen"]').forEach(btn => {
      btn.addEventListener('click', () => regenerate(parseInt(btn.dataset.index, 10)));
    });

    // Scroll to bottom
    requestAnimationFrame(() => {
      messagesArea.scrollTop = messagesArea.scrollHeight;
    });
  }
}

function updateSendButton() {
  const hasInput = state.input.trim().length > 0 && !state.loading;
  sendBtn.classList.toggle('active', hasInput);
}

function render() {
  renderSidebar();
  renderMessages();
  updateSendButton();
  sidebar.classList.toggle('closed', !state.sidebarOpen);
}

// --- Actions ---
function newChat() {
  const id = uid();
  state.conversations.order.unshift(id);
  state.conversations.byId[id] = { id, title: 'New chat', messages: [] };
  state.activeId = id;
  state.input = '';
  state.error = null;
  inputEl.value = '';
  autoResizeTextarea();
  render();
}

function deleteChat(id) {
  state.conversations.order = state.conversations.order.filter(x => x !== id);
  delete state.conversations.byId[id];
  if (state.conversations.order.length === 0) {
    const nid = uid();
    state.conversations.order.push(nid);
    state.conversations.byId[nid] = { id: nid, title: 'New chat', messages: [] };
  }
  if (id === state.activeId) {
    state.activeId = state.conversations.order[0];
  }
  state.error = null;
  render();
}

async function send(text) {
  const content = (text ?? state.input).trim();
  if (!content || state.loading) return;

  state.error = null;
  state.input = '';
  inputEl.value = '';
  autoResizeTextarea();

  const userMsg = { id: uid(), role: 'user', content };
  const active = getActive();
  const isFirst = active.messages.length === 0;
  updateConversation(state.activeId, c => ({
    ...c,
    title: isFirst ? content.slice(0, 40) : c.title,
    messages: [...c.messages, userMsg],
  }));
  render();

  state.loading = true;
  renderMessages();
  updateSendButton();

  try {
    const history = [...active.messages, userMsg].map(m => ({ role: m.role, content: m.content }));
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: MODEL, max_tokens: 1000, messages: history }),
    });
    const data = await response.json();
    const textBlock = (data.content || []).find(b => b.type === 'text');
    const replyText = textBlock ? textBlock.text : "I couldn't generate a response just now.";
    const aiMsg = { id: uid(), role: 'assistant', content: replyText };
    updateConversation(state.activeId, c => ({ ...c, messages: [...c.messages, aiMsg] }));
  } catch (err) {
    state.error = 'Something went wrong reaching the model. Please try again.';
  } finally {
    state.loading = false;
    render();
  }
}

async function regenerate(index) {
  const active = getActive();
  const msgs = active.messages;
  const prior = msgs.slice(0, index);
  const lastUser = [...prior].reverse().find(m => m.role === 'user');
  if (!lastUser) return;
  updateConversation(state.activeId, c => ({ ...c, messages: prior }));
  await send(lastUser.content);
}

function copyMsg(id, content, btn) {
  navigator.clipboard?.writeText(content);
  state.copiedId = id;
  // Swap icon briefly
  btn.innerHTML = `<svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
  setTimeout(() => {
    state.copiedId = null;
    if (btn && state.copiedId !== id) {
      btn.innerHTML = `<svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
    }
  }, 1500);
}

function toggleSidebar() {
  state.sidebarOpen = !state.sidebarOpen;
  sidebar.classList.toggle('closed', !state.sidebarOpen);
}

// --- Events ---
newChatBtn.addEventListener('click', newChat);
toggleSidebarBtn.addEventListener('click', toggleSidebar);

inputEl.addEventListener('input', (e) => {
  state.input = e.target.value;
  autoResizeTextarea();
  updateSendButton();
});

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

sendBtn.addEventListener('click', () => send());

// Initial render
render();
</script>
</body>
</html>
